<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#C9C7C8"/>
      <stop offset="100%" stop-color="#8D8A91"/>
    </linearGradient>
    <linearGradient id="silverDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8D8A91"/>
      <stop offset="100%" stop-color="#5C595E"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#EE2D24"/>
      <stop offset="100%" stop-color="#B81C16"/>
    </linearGradient>
  </defs>
  <!-- transparent background; the icon stands alone -->
  <g transform="translate(6 6)">
    <!-- Left-lower silver-dark facet of the A -->
    <polygon points="0,52 16,12 24,28 12,52" fill="url(#silverDark)"/>
    <!-- Left-upper light silver facet -->
    <polygon points="16,12 26,12 24,28" fill="url(#silver)"/>
    <!-- Right red diagonal stroke -->
    <polygon points="26,12 44,12 52,52 40,52 32,32 28,32" fill="url(#red)"/>
    <!-- Inner negative-space crossbar gap -->
    <polygon points="22,36 34,36 33,42 23,42" fill="none"/>
  </g>
</svg>
